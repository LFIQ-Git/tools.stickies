<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Stickies Settings</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e2e0d8;
    --accent: #1c7a2e; --accent-ink: #ffffff; --warn: #b3261e; --field: #ffffff;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1b1a; --panel: #252523; --ink: #ecebe6; --muted: #a3a29c; --line: #3a3936;
            --accent: #5cc46f; --accent-ink: #10210f; --warn: #ff8a80; --field: #1e1e1c; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.45 -apple-system, "Segoe UI", system-ui, sans-serif; }
  header { padding: 20px 24px 8px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  header p { margin: 0; color: var(--muted); }
  main { padding: 8px 24px 96px; }
  h2 { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 22px 0 8px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; }
  .head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; }
  .swatch { width: 14px; height: 14px; border-radius: 3px; flex: none; border: 1px solid rgba(0,0,0,.15); }
  .title { font-weight: 600; flex: 1; }
  .desc { color: var(--muted); font-size: 13px; padding: 0 14px 0 38px; margin-top: -6px; }
  .body { padding: 10px 14px 14px 38px; display: none; }
  .card.on .body { display: block; }
  label.field { display: block; margin: 10px 0 0; }
  label.field > span { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .help { color: var(--muted); font-size: 12px; margin-top: 3px; }
  input[type=text], input[type=password], input[type=number], textarea {
    width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--field); color: var(--ink); font: inherit; }
  textarea { min-height: 64px; resize: vertical; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
  input[type=number] { width: 100px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > input, .row > textarea { flex: 1; }
  .check { display: flex; gap: 8px; align-items: center; margin-top: 10px; font-size: 13px; }
  button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line);
           background: var(--panel); color: var(--ink); cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .switch { position: relative; width: 38px; height: 22px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; background: var(--line); border-radius: 22px; cursor: pointer; transition: .15s; }
  .switch span::before { content: ''; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px;
                         background: #fff; border-radius: 50%; transition: .15s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::before { transform: translateX(16px); }
  .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .result { font-size: 12px; margin-top: 10px; white-space: pre-wrap; }
  .result.err { color: var(--warn); }
  .saved { font-size: 12px; color: var(--muted); }
  .warn { color: var(--warn); font-size: 13px; margin: 8px 0; }
  footer { position: fixed; bottom: 0; left: 0; right: 0; display: flex; gap: 10px; align-items: center;
           justify-content: flex-end; padding: 12px 24px; background: var(--bg); border-top: 1px solid var(--line); }
  footer .status { margin-right: auto; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>Stickies</h1>
  <p>Turn on the places your to-dos live. Cards refresh on a schedule; ✓ on a card marks it done back at the source where the source allows it.</p>
</header>
<main>
  <div id="loadErrors"></div>
  <h2>Sources</h2>
  <div id="connectors"></div>
  <h2>General</h2>
  <div class="card on">
    <div class="body" style="padding-left:14px">
      <label class="field"><span>Refresh every (minutes)</span>
        <input type="number" id="refreshMinutes" min="1" max="240"></label>
      <label class="field"><span>Custom connectors folder</span>
        <div class="row"><input type="text" id="customConnectorDir" placeholder="Optional">
          <button id="pickDir" type="button">Choose…</button></div>
        <div class="help">A folder of JavaScript connector modules (see "How Stickies works" in the tray menu). They run with the same access as Stickies, so only use code you trust.</div>
      </label>
      <p class="help" id="version"></p>
    </div>
  </div>
</main>
<footer>
  <span class="status" id="status"></span>
  <button id="cancel" type="button">Close</button>
  <button id="save" class="primary" type="button">Save</button>
</footer>
<script src="settings-page.js"></script>
</body>
</html>
